name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name HighwayPlanner ^
            --collect-all anvil ^
            --collect-all nbtlib ^
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighwayPlanner-Windows
          path: dist/HighwayPlanner.exe
