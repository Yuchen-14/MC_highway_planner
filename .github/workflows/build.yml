name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        run: git clone https://github.com/${{ github.repository }}.git .
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name HighwayPlanner --collect-all anvil --collect-all nbtlib main.py
        shell: bash

      - name: Push to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf .
          cp dist/HighwayPlanner.exe .
          git add HighwayPlanner.exe
          git commit -m "Build $(date +%Y%m%d-%H%M%S)"
          git push origin builds --force
        shell: bash
